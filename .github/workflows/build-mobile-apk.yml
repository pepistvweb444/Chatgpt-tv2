name: Build Jarvis Mobile APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile-apk.yml'
      - 'api/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-mobile-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AndroidX
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable Jarvis signing key
        uses: actions/cache@v4
        with:
          path: ~/.jarvis-signing/jarvis-debug.keystore
          key: jarvis-debug-keystore-v1

      - name: Create signing key if needed
        shell: bash
        run: |
          mkdir -p ~/.jarvis-signing
          if [ ! -f ~/.jarvis-signing/jarvis-debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.jarvis-signing/jarvis-debug.keystore \
              -storepass jarvis123 -keypass jarvis123 -alias jarvis \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Jarvis Stable Debug,O=Jarvis,C=ES"
          fi

      - name: Apply Jarvis Mobile voice fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/src/main/java/com/jarvis/mobile/ChatActivity.kt')
          s = p.read_text()
          old = """val first = text.trim().let { t -> val cut = listOf(t.indexOf('.'), t.indexOf('?'), t.indexOf('!')).filter { it in 60..420 }.minOrNull(); if (cut != null) t.take(cut + 1) else t.take(360) }"""
          new = """val first = text.replace(Regex("https?://\\\\S+"), "").replace(Regex("[*_`#>|]+"), " ").replace(Regex("\\\\s+"), " ").trim()"""
          s = s.replace(old, new)
          s = s.replace('.put("speed", 1.2)', '.put("speed", 0.94)')
          s = s.replace('connectTimeout=7000; readTimeout=25000', 'connectTimeout=7000; readTimeout=45000')
          p.write_text(s)
          PY

      - name: Apply main UI voice transcription
        run: python3 mobile/patch_main_voice.py
      - name: Apply complete weather widget
        run: python3 mobile/patch_weather_widget.py
      - name: Fix Programadas menu crash
        run: python3 mobile/patch_scheduled_menu.py
      - name: Restore agents and Tado settings
        run: python3 mobile/patch_agents_tado.py
      - name: Add official Tado account login
        run: python3 mobile/patch_tado_oauth.py
      - name: Unify Tado OAuth state and climate queries
        run: python3 mobile/patch_tado_runtime.py
      - name: Fix Tado UI thread and show thermostat
        run: python3 mobile/patch_tado_ui_thread.py
      - name: Add Tado device cards and controls
        run: python3 mobile/patch_tado_devices_controls.py
      - name: Add MCP and phone permissions settings
        run: python3 mobile/patch_mcp_permissions.py
      - name: Connect SMS WhatsApp RCS and call actions
        run: python3 mobile/patch_phone_actions.py
      - name: Enable direct contact calls
        run: python3 mobile/patch_direct_calls.py
      - name: Wire multi-step phone agent
        run: python3 mobile/patch_phone_agent.py
      - name: Discover all installed launcher apps
        run: python3 mobile/patch_all_apps_catalog.py
      - name: Add authenticated Remote control
        run: python3 mobile/patch_remote_control.py
      - name: Add four-digit TV pairing PIN
        run: python3 mobile/patch_pairing_pin.py
      - name: Expose unread inbox to Jarvis TV
        run: python3 mobile/patch_tv_sync.py
      - name: Add messaging and agenda widgets
        run: python3 mobile/patch_messaging_agenda.py
      - name: Harden agenda sources and calendar diagnostics
        run: python3 mobile/patch_agenda_hardening.py
      - name: Build unified unread inbox
        run: python3 mobile/patch_unread_inbox.py
      - name: Enable continuous hands-free voice
        run: python3 mobile/patch_handsfree_voice.py
      - name: Enable persistent wake word overlay
        run: python3 mobile/patch_persistent_wake_overlay.py
      - name: Route daily news questions to rich widgets
        run: python3 mobile/patch_today_news_widgets.py
      - name: Render structured answers as rich widgets
        run: python3 mobile/patch_universal_widgets.py
      - name: Keep quick cards and wire recent chats
        run: python3 mobile/patch_persistent_home_recents.py
      - name: Wire persistent artifact library
        run: python3 mobile/patch_library_main.py
      - name: Keep assistant replies below user messages
        run: python3 mobile/patch_chat_order.py
      - name: Enable compound requests and widget speech
        run: python3 mobile/patch_multitask_orchestrator.py
      - name: Route direct Tado commands before LLM
        run: python3 mobile/patch_direct_tado_commands.py
      - name: Add direct Home Connect devices and controls
        run: python3 mobile/patch_homeconnect_direct.py
      - name: Normalize generated Kotlin
        run: python3 mobile/fix_generated_kotlin.py

      - name: Build mobile APK
        shell: bash
        run: gradle --no-daemon --stacktrace :mobile:assembleDebug

      - name: Sign and verify mobile APK
        shell: bash
        run: |
          KEYSTORE="$HOME/.jarvis-signing/jarvis-debug.keystore"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:jarvis123 --key-pass pass:jarvis123 --out Jarvis-Mobile-v0.2.5-debug.apk mobile/build/outputs/apk/debug/mobile-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Jarvis-Mobile-v0.2.5-debug.apk

      - name: Upload mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Mobile-v0.2.5-debug
          path: Jarvis-Mobile-v0.2.5-debug.apk
          if-no-files-found: error
