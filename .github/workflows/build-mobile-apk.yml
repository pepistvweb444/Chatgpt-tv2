name: Build Jarvis Mobile APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile-apk.yml'
      - 'api/**'
      - 'build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-mobile-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure AndroidX
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - uses: actions/cache@v4
        with:
          path: ~/.jarvis-signing/jarvis-debug.keystore
          key: jarvis-debug-keystore-v1
      - name: Create signing key if needed
        run: |
          mkdir -p ~/.jarvis-signing
          test -f ~/.jarvis-signing/jarvis-debug.keystore || keytool -genkeypair -v -keystore ~/.jarvis-signing/jarvis-debug.keystore -storepass jarvis123 -keypass jarvis123 -alias jarvis -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Jarvis Stable Debug,O=Jarvis,C=ES"
      - run: python3 mobile/patch_main_voice.py
      - run: python3 mobile/patch_weather_widget.py
      - run: python3 mobile/patch_scheduled_menu.py
      - run: python3 mobile/patch_agents_tado.py
      - run: python3 mobile/patch_tado_oauth.py
      - run: python3 mobile/patch_tado_runtime.py
      - run: python3 mobile/patch_tado_ui_thread.py
      - run: python3 mobile/patch_tado_devices_controls.py
      - run: python3 mobile/patch_mcp_permissions.py
      - run: python3 mobile/patch_phone_actions.py
      - run: python3 mobile/patch_direct_calls.py
      - run: python3 mobile/patch_phone_agent.py
      - run: python3 mobile/patch_phone_agent_cart_verification.py
      - run: python3 mobile/patch_makro_shopping.py
      - run: python3 mobile/patch_shopping_clarification.py
      - run: python3 mobile/patch_stateful_shopping.py
      - run: python3 mobile/patch_all_apps_catalog.py
      - run: python3 mobile/patch_remote_control.py
      - run: python3 mobile/patch_call_bridge.py
      - run: python3 mobile/patch_unified_call_bridge.py
      - run: python3 mobile/patch_pairing_pin.py
      - run: python3 mobile/patch_tv_sync.py
      - run: python3 mobile/patch_chat_sync_bridge.py
      - run: python3 mobile/patch_messaging_agenda.py
      - run: python3 mobile/patch_agenda_hardening.py
      - run: python3 mobile/patch_unread_inbox.py
      - run: python3 mobile/patch_new_messages_since_last_check.py
      - run: python3 mobile/patch_mobility_realtime.py
      - name: Add Bolt, Villavesa and delivery live tracking
        run: python3 mobile/patch_mobility_delivery_live.py
      - run: python3 mobile/patch_handsfree_voice.py
      - run: python3 mobile/patch_persistent_wake_overlay.py
      - name: Add text + mic composer to Jarvis overlay
        run: python3 mobile/patch_overlay_text_mic_lockscreen.py
      - run: python3 mobile/patch_today_news_widgets.py
      - run: python3 mobile/patch_universal_widgets.py
      - run: python3 mobile/patch_media_guide.py
      - run: python3 mobile/patch_persistent_home_recents.py
      - run: python3 mobile/patch_library_main.py
      - run: python3 mobile/patch_chat_order.py
      - run: python3 mobile/patch_multitask_orchestrator.py
      - run: python3 mobile/patch_direct_tado_commands.py
      - run: python3 mobile/patch_homeconnect_direct.py
      - run: python3 mobile/patch_homeconnect_authcode.py
      - run: python3 mobile/patch_homeconnect_strict_real.py
      - run: python3 mobile/patch_domotics_hub.py
      - run: python3 mobile/patch_domotics_rooms.py
      - run: python3 mobile/patch_domotics_quickcard.py
      - run: python3 mobile/patch_homey_cloud.py
      - run: python3 mobile/patch_lg_thinq_ui.py
      - run: python3 mobile/patch_thinq_connect.py
      - run: python3 mobile/patch_thinq_backend_ui.py
      - run: python3 mobile/patch_ai_provider_picker.py
      - run: python3 mobile/patch_fix_duplicate_onnewintent.py
      - run: python3 mobile/fix_generated_kotlin.py
      - run: python3 mobile/patch_inline_widgets_domotics.py
      - run: python3 mobile/patch_dedupe_responses.py
      - run: python3 mobile/patch_overlay_context_widgets.py
      - run: python3 mobile/patch_domotics_persistence_rate_limit.py
      - run: python3 mobile/patch_call_screening_setup.py
      - name: Request Android call-screening role
        run: python3 mobile/patch_call_screening_role.py
      - name: Normalize generated call notification regexes
        run: python3 mobile/patch_fix_notification_regexes.py
      - run: python3 mobile/patch_single_domotics_widget.py
      - run: python3 mobile/patch_fix_domotics_compile.py
      - name: Add complete TV dashboard bridge
        run: python3 mobile/patch_tv_dashboard_bridge.py
      - name: Verify critical generated features
        run: |
          grep -q 'ROLE_CALL_SCREENING' mobile/src/main/java/com/jarvis/mobile/DeviceHubActivity.kt
          grep -q 'mobility_feed' mobile/src/main/java/com/jarvis/mobile/JarvisNotificationListener.kt
          grep -q 'readMobilityStatus' mobile/src/main/java/com/jarvis/mobile/LocalActionRouter.kt
          grep -q 'LinkedBlockingQueue' mobile/src/main/java/com/jarvis/mobile/MobileSpeechService.kt
          grep -q '"Bolt"' mobile/src/main/java/com/jarvis/mobile/JarvisNotificationListener.kt
          grep -q '"Glovo"' mobile/src/main/java/com/jarvis/mobile/JarvisNotificationListener.kt
          grep -q '__MOBILITY_REMOTE__' mobile/src/main/java/com/jarvis/mobile/MainActivity.kt
          grep -q 'Villavesa · próximas llegadas' mobile/src/main/java/com/jarvis/mobile/MainActivity.kt
          grep -q 'isIncomingVoipCall' mobile/src/main/java/com/jarvis/mobile/JarvisNotificationListener.kt
          grep -q 'Escribe a Jarvis' mobile/src/main/java/com/jarvis/mobile/JarvisOverlayService.kt
          grep -q 'ACTION_ARM' mobile/src/main/java/com/jarvis/mobile/WakeWordService.kt
          grep -q 'private fun callsForTv' mobile/src/main/java/com/jarvis/mobile/PhoneBridgeService.kt
          grep -q 'private fun domoticsForTv' mobile/src/main/java/com/jarvis/mobile/PhoneBridgeService.kt
      - name: Build mobile APK
        run: gradle --no-daemon --stacktrace :mobile:assembleDebug
      - name: Verify APK is Jarvis Mobile 0.2.19
        run: |
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging mobile/build/outputs/apk/debug/mobile-debug.apk)
          echo "$BADGING" | grep "package: name='com.jarvis.mobile.stable' versionCode='19' versionName='0.2.19'"
      - name: Sign mobile APK
        run: |
          K="$HOME/.jarvis-signing/jarvis-debug.keystore"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$K" --ks-pass pass:jarvis123 --key-pass pass:jarvis123 --out Jarvis-Mobile-v0.2.19-debug.apk mobile/build/outputs/apk/debug/mobile-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Jarvis-Mobile-v0.2.19-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MOBILE-ONLY-Jarvis-v0.2.19
          path: Jarvis-Mobile-v0.2.19-debug.apk
          if-no-files-found: error