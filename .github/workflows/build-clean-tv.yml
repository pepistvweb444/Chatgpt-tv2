name: Build Clean Jarvis TV APK

on:
  push:
    branches: [ jarvis-tv-clean-v064 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify AndroidX
        shell: bash
        run: |
          grep -q '^android.useAndroidX=true' gradle.properties
          grep -q '^android.enableJetifier=true' gradle.properties

      - name: Clean and build TV only
        shell: bash
        run: |
          gradle --no-daemon --stacktrace clean :app:assembleDebug

      - name: Copy APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Jarvis-TV-v0.6.4-clean-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Jarvis-TV-v0.6.4-clean-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-TV-v0.6.4-clean-debug
          path: Jarvis-TV-v0.6.4-clean-debug.apk
          if-no-files-found: error
