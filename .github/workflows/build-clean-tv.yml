name: Build Clean Jarvis TV APK

on:
  push:
    branches: [ jarvis-tv-clean-v064 ]
    paths:
      - 'app/**'
      - '.github/workflows/build-clean-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure AndroidX
        shell: bash
        run: |
          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            'org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8' \
            'kotlin.code.style=official' > gradle.properties

      - name: Build TV APK
        shell: bash
        run: gradle --no-daemon --stacktrace clean :app:assembleDebug

      - name: Verify TV APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Jarvis-TV-v0.6.5-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Jarvis-TV-v0.6.5-debug.apk

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-TV-v0.6.5-debug
          path: Jarvis-TV-v0.6.5-debug.apk
          if-no-files-found: error
