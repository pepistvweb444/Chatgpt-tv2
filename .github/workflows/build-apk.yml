name: Build Jarvis APKs

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'Jarvis-TV-v0.6.3-debug.apk.b64'
      - 'Jarvis-Mobile-v0.2.4-debug.apk.b64'
      - 'LATEST_RUN_ID.txt'
      - 'BUILD_FAILURE_LOG.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable Jarvis signing key
        uses: actions/cache@v4
        with:
          path: ~/.jarvis-signing/jarvis-debug.keystore
          key: jarvis-debug-keystore-v1

      - name: Create signing key if first stable build
        shell: bash
        run: |
          mkdir -p ~/.jarvis-signing
          if [ ! -f ~/.jarvis-signing/jarvis-debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.jarvis-signing/jarvis-debug.keystore \
              -storepass jarvis123 -keypass jarvis123 -alias jarvis \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Jarvis Stable Debug,O=Jarvis,C=ES"
          fi

      - name: Optimize Jarvis voice quality and latency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # TV: faster recognition/TTS while keeping the selected OpenAI voice.
          tv = Path('app/src/main/java/com/jarvis/tv/MainActivity.kt')
          s = tv.read_text()
          s = s.replace('connectTimeout = 12000; readTimeout = 60000', 'connectTimeout = 8000; readTimeout = 45000')
          s = s.replace('putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, false)', 'putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)\n            putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 650L)\n            putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 450L)')
          s = s.replace('Escuchando 7 s · OpenAI', 'Escuchando 4 s · Jarvis')
          s = s.replace('stopRecorder(true) }, 7000', 'stopRecorder(true) }, 4000')
          s = s.replace('JSONObject().put("text", text).put("voice", prefs.getString("voice", "alloy") ?: "alloy")', 'JSONObject().put("text", text.take(420)).put("voice", prefs.getString("voice", "coral") ?: "coral").put("speed", 1.15)')
          tv.write_text(s)

          # Mobile: Android VOICE_RECOGNITION activates the device speech-processing path
          # (noise suppression/AGC where available) and cuts dead-air latency.
          mobile = Path('mobile/src/main/java/com/jarvis/mobile/MainActivity.kt')
          m = mobile.read_text()
          m = m.replace('connectTimeout = 12000; readTimeout = 60000', 'connectTimeout = 8000; readTimeout = 45000')
          m = m.replace('r.setAudioSource(MediaRecorder.AudioSource.MIC)', 'r.setAudioSource(MediaRecorder.AudioSource.VOICE_RECOGNITION)')
          m = m.replace('handler.postDelayed({ stopRecorder(true) }, 7000)', 'handler.postDelayed({ stopRecorder(true) }, 4000)')
          m = m.replace('JSONObject().put("text", chunks[index]).put("voice", voice)', 'JSONObject().put("text", chunks[index]).put("voice", voice).put("speed", 1.15)')

          # Start voice generation first and show the answer almost simultaneously,
          # so text no longer visibly leads audio by a long margin.
          old = '''                runOnUiThread {\n                    append("assistant", result.first)\n                    status.text = "Listo · contexto guardado"\n                    speak(result.first)\n                }'''
          new = '''                runOnUiThread {\n                    speak(result.first)\n                    handler.postDelayed({\n                        append("assistant", result.first)\n                        status.text = "Listo · contexto guardado"\n                    }, 250)\n                }'''
          m = m.replace(old, new)
          mobile.write_text(m)
          PY

      - name: Build TV and mobile APKs
        id: build_apk
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug :mobile:assembleDebug > build.log 2>&1
          status=$?
          tail -n 300 build.log > build-last-300-lines.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat build-last-300-lines.txt
          exit $status

      - name: Sign and verify APKs
        if: success()
        shell: bash
        run: |
          KEYSTORE="$HOME/.jarvis-signing/jarvis-debug.keystore"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:jarvis123 --key-pass pass:jarvis123 --out Jarvis-Mobile-v0.2.4-debug.apk mobile/build/outputs/apk/debug/mobile-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:jarvis123 --key-pass pass:jarvis123 --out Jarvis-TV-v0.6.3-debug.apk app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Jarvis-Mobile-v0.2.4-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Jarvis-TV-v0.6.3-debug.apk

      - name: Persist failure log
        if: failure() && steps.build_apk.outputs.exit_code != '0'
        shell: bash
        run: |
          cp build-last-300-lines.txt BUILD_FAILURE_LOG.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_FAILURE_LOG.txt
          git commit -m "ci: persist latest Android build failure [skip ci]" || true
          git push

      - name: Upload TV APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-TV-v0.6.3-debug
          path: Jarvis-TV-v0.6.3-debug.apk
          if-no-files-found: error

      - name: Upload mobile APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Mobile-v0.2.4-debug
          path: Jarvis-Mobile-v0.2.4-debug.apk
          if-no-files-found: error

      - name: Record successful run ID
        if: success()
        shell: bash
        run: |
          echo "${{ github.run_id }}" > LATEST_RUN_ID.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST_RUN_ID.txt
          git commit -m "ci: record signed Jarvis APK run [skip ci]" || true
          git push

      - name: Publish APK payloads for ChatGPT
        if: success()
        shell: bash
        run: |
          base64 -w 0 Jarvis-TV-v0.6.3-debug.apk > Jarvis-TV-v0.6.3-debug.apk.b64
          base64 -w 0 Jarvis-Mobile-v0.2.4-debug.apk > Jarvis-Mobile-v0.2.4-debug.apk.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Jarvis-TV-v0.6.3-debug.apk.b64 Jarvis-Mobile-v0.2.4-debug.apk.b64
          git commit -m "build: publish signed Jarvis APK payloads [skip ci]" || true
          git push
