name: Build Jarvis TV APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'Jarvis-TV-v0.2-debug.apk.b64'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-tv-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK and capture log
        id: build_apk
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug > build.log 2>&1
          status=$?
          tail -n 250 build.log > build-last-250-lines.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat build-last-250-lines.txt
          exit $status

      - name: Persist failure log in repository
        if: failure() && steps.build_apk.outputs.exit_code != '0'
        shell: bash
        run: |
          cp build-last-250-lines.txt BUILD_FAILURE_LOG.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_FAILURE_LOG.txt
          git commit -m "ci: persist latest Android build failure [skip ci]" || true
          git push

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-TV-v0.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK payload for ChatGPT
        if: success()
        shell: bash
        run: |
          base64 -w 0 app/build/outputs/apk/debug/app-debug.apk > Jarvis-TV-v0.2-debug.apk.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Jarvis-TV-v0.2-debug.apk.b64
          git commit -m "build: publish Jarvis TV v0.2 APK payload [skip ci]" || true
          git push
