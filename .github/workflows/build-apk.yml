name: Build Jarvis TV APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'Jarvis-TV-v0.4.1-debug.apk.b64'
      - 'LATEST_RUN_ID.txt'
      - 'BUILD_FAILURE_LOG.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-tv-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK and capture log
        id: build_apk
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug > build.log 2>&1
          status=$?
          tail -n 250 build.log > build-last-250-lines.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat build-last-250-lines.txt
          exit $status
      - name: Persist failure log
        if: failure() && steps.build_apk.outputs.exit_code != '0'
        shell: bash
        run: |
          cp build-last-250-lines.txt BUILD_FAILURE_LOG.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_FAILURE_LOG.txt
          git commit -m "ci: persist latest Android build failure [skip ci]" || true
          git push
      - name: Rename APK
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk Jarvis-TV-v0.4.1-debug.apk
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-TV-v0.4.1-debug
          path: Jarvis-TV-v0.4.1-debug.apk
          if-no-files-found: error
      - name: Record successful run ID
        if: success()
        shell: bash
        run: |
          echo "${{ github.run_id }}" > LATEST_RUN_ID.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST_RUN_ID.txt
          git commit -m "ci: record successful v0.4.1 APK run [skip ci]" || true
          git push
      - name: Publish v0.4.1 release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.4.1 >/dev/null 2>&1; then
            gh release upload v0.4.1 Jarvis-TV-v0.4.1-debug.apk --clobber
          else
            gh release create v0.4.1 Jarvis-TV-v0.4.1-debug.apk --title "Jarvis TV v0.4.1" --notes "Backend/OpenAI diagnostics, default Vercel backend, explicit overlay permission control, persistent assistant bubble and microphone diagnostics."
          fi
      - name: Publish APK payload for ChatGPT
        if: success()
        shell: bash
        run: |
          base64 -w 0 Jarvis-TV-v0.4.1-debug.apk > Jarvis-TV-v0.4.1-debug.apk.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Jarvis-TV-v0.4.1-debug.apk.b64
          git commit -m "build: publish Jarvis TV v0.4.1 APK payload [skip ci]" || true
          git push
