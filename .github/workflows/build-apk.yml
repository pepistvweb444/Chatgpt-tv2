name: Build Jarvis TV APK

on:
  push:
    branches: [ main, jarvis-write-test ]
    paths-ignore:
      - 'Jarvis-TV-v0.6.6-debug.apk.b64'
      - 'LATEST_RUN_ID.txt'
      - 'BUILD_FAILURE_LOG.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-tv-apk-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force AndroidX configuration
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable Jarvis signing key
        uses: actions/cache@v4
        with:
          path: ~/.jarvis-signing/jarvis-debug.keystore
          key: jarvis-debug-keystore-v1

      - name: Create signing key if needed
        shell: bash
        run: |
          mkdir -p ~/.jarvis-signing
          if [ ! -f ~/.jarvis-signing/jarvis-debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.jarvis-signing/jarvis-debug.keystore \
              -storepass jarvis123 -keypass jarvis123 -alias jarvis \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Jarvis Stable Debug,O=Jarvis,C=ES"
          fi

      - name: Apply Jarvis TV runtime patch
        run: python3 scripts/apply_v065.py

      - name: Apply TV companion and mobile remote
        run: python3 scripts/apply_tv_companion.py

      - name: Apply four-digit mobile pairing PIN
        run: python3 scripts/apply_tv_pairing_pin.py

      - name: Apply mobile-style TV interface
        run: python3 scripts/apply_tv_mobile_ui.py

      - name: Apply mobile agenda and unread sync widgets
        run: python3 scripts/apply_tv_personal_sync.py

      - name: Apply rich TV news widgets with media previews
        run: python3 scripts/apply_tv_rich_news_widgets.py

      - name: Synchronize chats with Jarvis Mobile
        run: python3 scripts/apply_tv_chat_sync.py

      - name: Build TV APK only
        id: build_apk
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug > build.log 2>&1
          status=$?
          tail -n 300 build.log > build-last-300-lines.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat build-last-300-lines.txt
          exit $status

      - name: Sign and verify TV APK
        if: success()
        shell: bash
        run: |
          KEYSTORE="$HOME/.jarvis-signing/jarvis-debug.keystore"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:jarvis123 --key-pass pass:jarvis123 --out Jarvis-TV-v0.6.7-debug.apk app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Jarvis-TV-v0.6.7-debug.apk

      - name: Persist failure log
        if: failure() && steps.build_apk.outputs.exit_code != '0'
        shell: bash
        run: |
          cp build-last-300-lines.txt BUILD_FAILURE_LOG.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_FAILURE_LOG.txt
          git commit -m "ci: persist latest TV build failure [skip ci]" || true
          git push

      - name: Upload TV APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-TV-v0.6.7-debug
          path: Jarvis-TV-v0.6.7-debug.apk
          if-no-files-found: error

      - name: Record successful run ID
        if: success()
        shell: bash
        run: |
          echo "${{ github.run_id }}" > LATEST_RUN_ID.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST_RUN_ID.txt
          git commit -m "ci: record signed Jarvis TV APK [skip ci]" || true
          git push

      - name: Publish APK payload for ChatGPT
        if: success()
        shell: bash
        run: |
          base64 -w 0 Jarvis-TV-v0.6.7-debug.apk > Jarvis-TV-v0.6.7-debug.apk.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Jarvis-TV-v0.6.7-debug.apk.b64
          git commit -m "build: publish signed Jarvis TV 0.6.7 APK payload [skip ci]" || true
          git push
