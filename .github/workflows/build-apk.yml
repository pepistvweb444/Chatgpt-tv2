name: Build Jarvis APKs

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'Jarvis-TV-v0.6-debug.apk.b64'
      - 'Jarvis-Mobile-v0.2.1-debug.apk.b64'
      - 'LATEST_RUN_ID.txt'
      - 'BUILD_FAILURE_LOG.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build TV and mobile APKs
        id: build_apk
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug :mobile:assembleDebug > build.log 2>&1
          status=$?
          tail -n 300 build.log > build-last-300-lines.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat build-last-300-lines.txt
          exit $status
      - name: Explicitly sign APKs
        if: success()
        shell: bash
        run: |
          keytool -genkeypair -v -keystore jarvis-debug.keystore -storepass jarvis123 -keypass jarvis123 -alias jarvis -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Jarvis,O=Jarvis,C=ES"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks jarvis-debug.keystore --ks-pass pass:jarvis123 --key-pass pass:jarvis123 --out Jarvis-Mobile-v0.2.1-debug.apk mobile/build/outputs/apk/debug/mobile-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks jarvis-debug.keystore --ks-pass pass:jarvis123 --key-pass pass:jarvis123 --out Jarvis-TV-v0.6-debug.apk app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Jarvis-Mobile-v0.2.1-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Jarvis-TV-v0.6-debug.apk
      - name: Persist failure log
        if: failure() && steps.build_apk.outputs.exit_code != '0'
        shell: bash
        run: |
          cp build-last-300-lines.txt BUILD_FAILURE_LOG.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_FAILURE_LOG.txt
          git commit -m "ci: persist latest Android build failure [skip ci]" || true
          git push
      - name: Upload TV APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-TV-v0.6-debug
          path: Jarvis-TV-v0.6-debug.apk
          if-no-files-found: error
      - name: Upload mobile APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Mobile-v0.2.1-debug
          path: Jarvis-Mobile-v0.2.1-debug.apk
          if-no-files-found: error
      - name: Record successful run ID
        if: success()
        shell: bash
        run: |
          echo "${{ github.run_id }}" > LATEST_RUN_ID.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST_RUN_ID.txt
          git commit -m "ci: record signed Jarvis APK run [skip ci]" || true
          git push
      - name: Publish APK payloads for ChatGPT
        if: success()
        shell: bash
        run: |
          base64 -w 0 Jarvis-TV-v0.6-debug.apk > Jarvis-TV-v0.6-debug.apk.b64
          base64 -w 0 Jarvis-Mobile-v0.2.1-debug.apk > Jarvis-Mobile-v0.2.1-debug.apk.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Jarvis-TV-v0.6-debug.apk.b64 Jarvis-Mobile-v0.2.1-debug.apk.b64
          git commit -m "build: publish signed Jarvis APK payloads [skip ci]" || true
          git push
