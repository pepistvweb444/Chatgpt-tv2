name: Build Jarvis Mobile APK

on:
  push:
    branches:
      - jarvis-tv-clean-v064
    paths:
      - mobile/**
      - scripts/patch_mobile_continuous_voice.py
      - .github/workflows/build-mobile.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-mobile-v065
  cancel-in-progress: true

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply continuous voice integration
        shell: bash
        run: python3 scripts/patch_mobile_continuous_voice.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure AndroidX
        shell: bash
        run: |
          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            'org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8' \
            'kotlin.code.style=official' > gradle.properties

      - name: Build Mobile APK
        shell: bash
        run: gradle --no-daemon --stacktrace clean :mobile:assembleDebug

      - name: Verify Mobile APK
        shell: bash
        run: |
          cp mobile/build/outputs/apk/debug/mobile-debug.apk Jarvis-Mobile-v0.6.5-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Jarvis-Mobile-v0.6.5-debug.apk

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Mobile-v0.6.5-debug
          path: Jarvis-Mobile-v0.6.5-debug.apk
          if-no-files-found: error
