name: Build Jarvis Mobile APK

on:
  push:
    branches:
      - jarvis-tv-clean-v064
    paths:
      - mobile/**
      - .github/workflows/build-mobile.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-mobile-v065
  cancel-in-progress: true

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Normalize Kotlin regex source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/src/main/java/com/jarvis/mobile/LocalActionRouter.kt')
          s = p.read_text()
          bad = 'Regex("(?:a|en|temperatura)\\s*(\\d{1,2}(?:[.,]\\d)?)\\s*(?:grados|°)?")'
          good = 'Regex("""(?:a|en|temperatura)\\s*(\\d{1,2}(?:[.,]\\d)?)\\s*(?:grados|°)?""")'
          if bad in s:
              s = s.replace(bad, good)
              p.write_text(s)
          PY

      - name: Build Mobile APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :mobile:assembleDebug 2>&1 | tee mobile-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Mobile-build-log
          path: mobile-build.log
          if-no-files-found: warn

      - name: Verify Mobile APK
        if: success()
        shell: bash
        run: |
          cp mobile/build/outputs/apk/debug/mobile-debug.apk Jarvis-Mobile-v0.6.5-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Jarvis-Mobile-v0.6.5-debug.apk

      - name: Upload Mobile APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Mobile-v0.6.5-debug
          path: Jarvis-Mobile-v0.6.5-debug.apk
          if-no-files-found: error
