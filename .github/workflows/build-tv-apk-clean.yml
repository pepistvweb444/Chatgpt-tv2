name: Build Jarvis TV APK Clean

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'api/**'
      - '.github/workflows/build-tv-apk-clean.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-tv-apk-clean-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - uses: actions/cache@v4
        with:
          path: ~/.jarvis-signing/jarvis-debug.keystore
          key: jarvis-debug-keystore-v1
      - run: |
          mkdir -p ~/.jarvis-signing
          test -f ~/.jarvis-signing/jarvis-debug.keystore || keytool -genkeypair -v -keystore ~/.jarvis-signing/jarvis-debug.keystore -storepass jarvis123 -keypass jarvis123 -alias jarvis -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Jarvis Stable Debug,O=Jarvis,C=ES"
      - run: python3 scripts/apply_v065.py
      - run: python3 scripts/apply_tv_companion.py
      - run: python3 scripts/apply_tv_pairing_pin.py
      - run: python3 scripts/apply_tv_mobile_ui.py
      - run: python3 scripts/apply_tv_personal_sync.py
      - run: python3 scripts/apply_tv_rich_news_widgets.py
      - run: python3 scripts/apply_tv_chat_sync.py
      - name: Mirror and control incoming calls from Jarvis Mobile
        run: python3 scripts/apply_tv_calls.py
      - run: python3 scripts/apply_tv_streaming_focus.py
      - run: python3 scripts/apply_tv_mobile_parity.py
      - name: Verify call bridge hooks
        run: |
          grep -q 'fun incomingCall()' app/src/main/java/com/jarvis/tv/MobileRemoteClient.kt
          grep -q 'fun callAction' app/src/main/java/com/jarvis/tv/MobileRemoteClient.kt
          grep -q 'pollIncomingCall' app/src/main/java/com/jarvis/tv/MainActivity.kt
      - run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK is Jarvis TV 0.6.10
        run: |
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk)
          echo "$BADGING" | grep "package: name='com.jarvis.tv' versionCode='17' versionName='0.6.10'"
      - name: Sign TV APK
        run: |
          K="$HOME/.jarvis-signing/jarvis-debug.keystore"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$K" --ks-pass pass:jarvis123 --key-pass pass:jarvis123 --out Jarvis-TV-v0.6.10-debug.apk app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Jarvis-TV-v0.6.10-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TV-ONLY-Jarvis-v0.6.10
          path: Jarvis-TV-v0.6.10-debug.apk
          if-no-files-found: error
