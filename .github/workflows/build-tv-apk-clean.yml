name: Build Jarvis TV APK Clean

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'api/**'
      - '.github/workflows/build-tv-apk-clean.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-tv-apk-clean-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - uses: actions/cache@v4
        with:
          path: ~/.jarvis-signing/jarvis-debug.keystore
          key: jarvis-debug-keystore-v1
      - run: |
          mkdir -p ~/.jarvis-signing
          test -f ~/.jarvis-signing/jarvis-debug.keystore || keytool -genkeypair -v -keystore ~/.jarvis-signing/jarvis-debug.keystore -storepass jarvis123 -keypass jarvis123 -alias jarvis -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Jarvis Stable Debug,O=Jarvis,C=ES"
      - run: python3 scripts/apply_v065.py
      - run: python3 scripts/apply_tv_companion.py
      - run: python3 scripts/apply_tv_pairing_pin.py
      - run: python3 scripts/apply_tv_mobile_ui.py
      - run: python3 scripts/apply_tv_personal_sync.py
      - run: python3 scripts/apply_tv_rich_news_widgets.py
      - run: python3 scripts/apply_tv_chat_sync.py
      - name: Mirror and control incoming calls from Jarvis Mobile
        run: python3 scripts/apply_tv_calls.py
      - run: python3 scripts/apply_tv_streaming_focus.py
      - run: python3 scripts/apply_tv_mobile_parity.py
      - name: Improve Fire TV voice latency and microphone capture
        run: python3 scripts/apply_tv_voice_latency_v0611.py
      - name: Add agenda calls delivery finance and synced domotics
        run: python3 scripts/apply_tv_personal_dashboard_v0611.py
      - name: Keep bubble call filter and favorites visible on Fire TV
        run: python3 scripts/apply_tv_fire_overlay_calls_v0611.py
      - name: Make call filter usable with the Fire TV remote
        run: python3 scripts/apply_tv_call_overlay_focus_v0611.py
      - name: Fix streaming loading agenda timeline and chat navigation
        run: python3 scripts/apply_tv_usability_v0612.py
      - name: Restore cloned voice and complete mobile domotics
        run: python3 scripts/apply_tv_clone_domotics_v0613.py
      - name: Add inline dashboard and real TV domotics control
        run: python3 scripts/apply_tv_dashboard_control_v0614.py
      - name: Add scheduled briefing reverse bridge
        run: python3 scripts/apply_tv_morning_remote_v0614.py
      - name: Reduce cloned voice latency with parallel chunks
        run: python3 scripts/apply_tv_fast_clone_v0614.py
      - name: Diagnose TV 0.6.14 generated features
        run: |
          check() { if grep -q "$1" "$2"; then echo "OK: $1"; else echo "MISSING: $1 in $2"; fi; }
          check 'fun incomingCall()' app/src/main/java/com/jarvis/tv/MobileRemoteClient.kt
          check 'fun calls()' app/src/main/java/com/jarvis/tv/MobileRemoteClient.kt
          check 'fun domotics()' app/src/main/java/com/jarvis/tv/MobileRemoteClient.kt
          check 'fun domoticsCommand' app/src/main/java/com/jarvis/tv/MobileRemoteClient.kt
          check 'homeContext' app/src/main/java/com/jarvis/tv/MainActivity.kt
          check 'executeTvDomoticsAction' app/src/main/java/com/jarvis/tv/MainActivity.kt
          check 'renderDomoticsControlCard' app/src/main/java/com/jarvis/tv/MainActivity.kt
          check 'showMorningBriefing' app/src/main/java/com/jarvis/tv/MainActivity.kt
          check 'splitCloneSpeech' app/src/main/java/com/jarvis/tv/MainActivity.kt
          check 'speech-fast-clone' app/src/main/java/com/jarvis/tv/MainActivity.kt
          check 'inlineDetailLabel' app/src/main/res/layout/activity_main.xml
          check 'TvCommandService' app/src/main/AndroidManifest.xml
          check 'updateCallOverlay' app/src/main/java/com/jarvis/tv/JarvisAccessibilityService.kt
      - name: Compile Jarvis TV
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK is Jarvis TV 0.6.14
        run: |
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk)
          echo "$BADGING" | grep "package: name='com.jarvis.tv' versionCode='21' versionName='0.6.14'"
      - name: Sign TV APK
        run: |
          K="$HOME/.jarvis-signing/jarvis-debug.keystore"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$K" --ks-pass pass:jarvis123 --key-pass pass:jarvis123 --out Jarvis-TV-v0.6.14-debug.apk app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Jarvis-TV-v0.6.14-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TV-ONLY-Jarvis-v0.6.14
          path: Jarvis-TV-v0.6.14-debug.apk
          if-no-files-found: error
