name: Build Jarvis TV APK Clean

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/build-tv-apk-clean.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-tv-apk-clean-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AndroidX
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable Jarvis signing key
        uses: actions/cache@v4
        with:
          path: ~/.jarvis-signing/jarvis-debug.keystore
          key: jarvis-debug-keystore-v1

      - name: Create signing key if needed
        shell: bash
        run: |
          mkdir -p ~/.jarvis-signing
          if [ ! -f ~/.jarvis-signing/jarvis-debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.jarvis-signing/jarvis-debug.keystore \
              -storepass jarvis123 -keypass jarvis123 -alias jarvis \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Jarvis Stable Debug,O=Jarvis,C=ES"
          fi

      - name: Apply Jarvis TV runtime patch
        run: python3 scripts/apply_v065.py
      - name: Apply TV companion and mobile remote
        run: python3 scripts/apply_tv_companion.py
      - name: Apply four-digit mobile pairing PIN
        run: python3 scripts/apply_tv_pairing_pin.py
      - name: Apply mobile-style TV interface
        run: python3 scripts/apply_tv_mobile_ui.py
      - name: Apply mobile agenda and unread sync widgets
        run: python3 scripts/apply_tv_personal_sync.py
      - name: Apply rich TV news widgets with media previews
        run: python3 scripts/apply_tv_rich_news_widgets.py
      - name: Synchronize chats with Jarvis Mobile
        run: python3 scripts/apply_tv_chat_sync.py

      - name: Build TV APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Sign and verify TV APK
        shell: bash
        run: |
          KEYSTORE="$HOME/.jarvis-signing/jarvis-debug.keystore"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-pass pass:jarvis123 --key-pass pass:jarvis123 \
            --out Jarvis-TV-v0.6.7-debug.apk app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Jarvis-TV-v0.6.7-debug.apk

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-ONLY-Jarvis-v0.6.7
          path: Jarvis-TV-v0.6.7-debug.apk
          if-no-files-found: error
